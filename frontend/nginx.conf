server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # La SPA usa rutas del lado del cliente (react-router): cualquier path que no sea un
    # archivo real tiene que devolver index.html, o un F5 en /encounters daría 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El frontend habla siempre con rutas relativas (/api/...), así que no hay una URL de
    # backend embebida en el bundle que pueda quedar apuntando a otro lado por entorno.
    # nginx la resuelve acá, dentro de la red de compose.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # No se reenvía X-Forwarded-For a propósito: el backend usa getRemoteAddr() para
        # el rate limiting (§8.4) y confiar en un header reenviado reintroduciría el
        # vector que esa decisión evita. Si algún día hace falta, el backend tendría que
        # saber en qué proxies confiar, y eso es una decisión aparte.
    }

    # Cabeceras de seguridad básicas para contenido estático.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}
