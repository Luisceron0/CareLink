name: CI

on: [push, pull_request]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Sin `|| true`. Este paso lo tenía, y lo que ocultaba no era un test
      # inestable: el reactor no compilaba desde hacía commits, porque tres
      # módulos stub declaraban <parent> sin <relativePath>. El pipeline estuvo
      # en verde sobre un proyecto que no construía. Los módulos se eliminaron
      # (§3.3, §16.3) y la máscara se va con ellos.
      - name: Run Java build
        run: mvn -B -DskipTests package
      - name: Semgrep (SAST)
        uses: returntocorp/semgrep-action@v1

      - name: Java SCA (OWASP dependency-check)
        run: |
          if [ -f pom.xml ]; then mvn org.owasp:dependency-check-maven:check || true; fi

      - name: Gitleaks (secret scanning)
        uses: zricethezav/gitleaks-action@v2
        with:
          args: --redact
